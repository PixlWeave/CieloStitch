
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cielostitch-core"
version = "0.5.00"
description = "Core stitching engine for CieloStitch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
"numpy==2.4.2",
"opencv-python-headless",
"packaging==26.0",
"tifffile==2026.2.20",
"astropy",
"xisf"
]

[project.optional-dependencies]
dev = [
"pytest>=8",
"pytest-cov>=5"
]

[project.scripts]
cielostitch-cli = "cielostitch_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cielostitch_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]